[tool.basedpyright]
stubPath = "stubs"
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
# Downgrade from strict/all to standard to allow rapid prototyping
typeCheckingMode = "standard"
# Explicitly allow 'Any' for dynamic JSON API boundaries
reportExplicitAny = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E: pycodestyle (formatting), F: pyflakes (bugs), B: flake8-bugbear (design flaws)
# I: isort (import sorting), UP: pyupgrade (modern syntax)
select = ["E", "F", "B", "I", "UP"]
# Ignore pedantic rules that do not prevent actual runtime failures
ignore = []

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deb2repo-client"
version = "0.1.0"
description = "Secure CLI and SDK for deb2repo managment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["requests>=2.31.0"]

[project.scripts]
repo-cli = "deb2repo_client.cli:main"
repo-tui = "deb2repo_client.tui:main"
