services:
  deb2repo:
    image: ghcr.io/brozi/deb2repo:latest
    container_name: deb2repo
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8889:8000"
    volumes:
      - ${STATE_DIR}:/app/state # Persistent SQLite database
      - ${REPO_DIR}:/app/repo # The target Debian repository
      - ~/.gnupg:/root/.gnupg # Bind the host's GPG keychain

  landing-page:
    image: nginx:alpine
    container_name: deb2repo-landing
    restart: unless-stopped
    ports:
      - "8888:80" # Expose the APT repository to clients
    volumes:
      - ${REPO_DIR}:/usr/share/nginx/html:ro # Read-only access for Nginx
      - ./repo-nginx.conf:/etc/nginx/conf.d/default.conf:ro
