server {
    listen 80;
    
    location / {
        root /usr/share/nginx/html;
        
        # Explicitly enable directory listing
        autoindex on;

        index index.html
        
        # Display human-readable file sizes and local timestamps
        autoindex_exact_size off;
        autoindex_localtime on;

        default_type text/plain;
        # ensure apt clients cache things correctly
        add_header Cache-Control "public, must-revalidate"
    }

    # proxy all API traffic to the fastapi container
    location /api/ {

      # deb2repo resolves automatically via Docker's internal DNS
      proxy_pass http://deb2repo:8000;


      # forward client information to fastapi
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $schema;

    }
}
